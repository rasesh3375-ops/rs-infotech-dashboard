# Emails yesterday's cash transactions every morning, from the figures the
# Tally sync stored in Firestore -- see .github/scripts/daily_cash_email.py.
# Runs on GitHub's servers, so it doesn't need any office PC to be on.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
# FIREBASE_SERVICE_ACCOUNT, GMAIL_USER, GMAIL_APP_PASSWORD and MAIL_TO.
# "Run workflow" on the Actions tab sends one straight away, for any date.
name: Daily cash email

on:
  schedule:
    # 05:30 UTC is 11:00 AM in India, after the 10 AM Tally sync. GitHub
    # can start scheduled runs a little late at busy times.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to send (YYYY-MM-DD). Leave empty for yesterday.'
        required: false
        default: ''

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet firebase-admin
      # The date goes in through an environment variable, not pasted into
      # the command, so nothing typed into it can run as a shell command.
      - run: python .github/scripts/daily_cash_email.py "$SEND_DATE"
        env:
          SEND_DATE: ${{ github.event.inputs.date }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
