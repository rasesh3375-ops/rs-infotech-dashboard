# Emails yesterday's Daily Cash Transactions, Daily Bank Transactions,
# Daily Purchase Entries and Daily Sales Entries every morning, and the
# Pending Delivery Challans, Pending Proforma Invoices and the Stock Summary
# every Saturday, and the Debtors Pending 60+ Days and the Collection Call
# List every Monday,
# one email each, from the figures the Tally sync stored in Firestore -- see
# .github/scripts/daily_report_emails.py. Runs on GitHub's servers, so it
# doesn't need any office PC to be on.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
# FIREBASE_SERVICE_ACCOUNT, GMAIL_USER, GMAIL_APP_PASSWORD and MAIL_TO.
# ANTHROPIC_API_KEY is optional: with it, the call list's payment reminders
# are worded by AI; without it they're standard wording.
# "Run workflow" on the Actions tab sends them straight away, for any date.
name: Daily report emails

on:
  schedule:
    # 05:30 UTC is 11:00 AM in India, after the 10 AM Tally sync. GitHub
    # can start scheduled runs a little late at busy times.
    - cron: '30 5 * * *'
    # 05:35 UTC on Saturdays: the two pending lists and the stock, just after the daily ones.
    - cron: '35 5 * * 6'
    # 05:40 UTC on Mondays: the debtors pending 60+ days and the call list, for the week's follow-up calls.
    - cron: '40 5 * * 1'
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to send (YYYY-MM-DD). Leave empty for yesterday.'
        required: false
        default: ''
      report:
        description: 'Which emails (daily = the four daily ones, weekly = the two pending lists and the stock, debtors = pending 60+ days, calls = collection call list)'
        type: choice
        options: [daily, weekly, debtors, calls, cash, bank, purchase, sales, challans, proformas, stock]
        default: daily

# Read the code and nothing else: nothing here pushes, comments or edits the
# repository, so the token GitHub hands each run can't either.
permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet firebase-admin reportlab
      # The inputs go in through environment variables, not pasted into the
      # command, so nothing typed into them can run as a shell command.
      - run: python .github/scripts/daily_report_emails.py "$SEND_DATE" "--report=${SEND_REPORT:-daily}"
        env:
          SEND_DATE: ${{ github.event.inputs.date }}
          SEND_REPORT: ${{ github.event.schedule == '35 5 * * 6' && 'weekly' || github.event.schedule == '40 5 * * 1' && 'monday' || github.event.inputs.report }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
